name: Build Docker image v1.8.3

on:
  push:
    branches:
      - codex/docker-image-v1.8.3
    paths:
      - '.dockerignore'
      - '.github/workflows/docker-image-v1.8.3.yml'
      - 'Dockerfile'
      - 'apps/web/**'
      - 'compose.yaml'
      - 'content/**'
      - 'docker/**'
      - 'output/**'
      - 'package*.json'
      - 'packages/**'
      - 'release/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image with v1.8.3 resources
        run: docker build --pull --build-arg ASSETS_RELEASE=v1.8.3 --tag china-textbook-study-free:local .

      - name: Export image archive
        run: docker save china-textbook-study-free:local | gzip -1 > congcong-school-v1.8.3.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: congcong-school-image-v1.8.3
          path: congcong-school-v1.8.3.tar.gz
          if-no-files-found: error
          retention-days: 7
